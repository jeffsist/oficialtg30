<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Abrir site TG30</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f5f5f3; color: #1e2420; font: 16px/1.55 system-ui, sans-serif; }
    main { width: 100%; max-width: 440px; padding: 30px 24px; border: 1px solid #e2e5df; border-radius: 20px; background: white; }
    small { color: #697367; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 12px 0; font-size: 28px; line-height: 1.2; }
    p { color: #566052; }
    a, button { display: block; width: 100%; margin-top: 12px; padding: 15px; border: 1px solid #cbd3c8; border-radius: 10px; background: white; color: #253322; text-align: center; text-decoration: none; font: inherit; font-weight: 650; cursor: pointer; }
    #abrir { background: #254b32; border-color: #254b32; color: white; }
    input { width: 100%; padding: 12px; margin-top: 16px; border: 1px solid #cbd3c8; border-radius: 8px; font: inherit; font-size: 14px; }
    #ajuda { font-size: 14px; }
    :focus-visible { outline: 3px solid #c58c17; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <small>TESTE DE ABERTURA · TG30</small>
    <h1>Abrir no seu navegador</h1>
    <p id="estado" role="status" aria-live="polite">Continue para acessar o site TG30.</p>
    <a id="abrir" href="https://oficialtg30.com.br/">Continuar para o site</a>
    <p id="ajuda">Destino: oficialtg30.com.br</p>
    <input id="endereco" aria-label="Endereço do site" value="https://oficialtg30.com.br/" readonly>
    <button id="copiar" type="button">Copiar link</button>
    <noscript><p>Abra o menu do aplicativo e escolha abrir no navegador, ou copie o endereço acima.</p></noscript>
  </main>
  <script>
    (() => {
      const destino = 'https://oficialtg30.com.br/';
      const abrir = document.getElementById('abrir');
      const estado = document.getElementById('estado');
      const ajuda = document.getElementById('ajuda');
      const android = /Android/i.test(navigator.userAgent);
      const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const alternativa = new URL(location.href);
      alternativa.searchParams.set('manual', '1');
      alternativa.hash = '';
      // Sem pacote: pede ao Android que resolva o navegador, sem escolher Chrome ou Edge.
      const intent = 'intent://oficialtg30.com.br/#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=' + encodeURIComponent(alternativa.href) + ';end';

      if (android) {
        abrir.href = intent;
        abrir.textContent = 'Abrir no navegador';
        estado.textContent = 'Tentando solicitar a abertura no navegador padrão…';
        ajuda.textContent = 'Se não abrir, toque no botão. Se o aplicativo impedir a saída, use o menu dele para abrir no navegador ou copie o link.';
        abrir.addEventListener('click', () => {
          estado.textContent = 'Solicitação enviada. Se aparecer uma escolha de navegador, selecione o que você usa.';
        });
        if (!new URLSearchParams(location.search).has('manual')) {
          // Tentativa única de teste. Alguns aplicativos exigem um toque e bloqueiam esta navegação automática.
          window.location.assign(intent);
        } else {
          estado.textContent = 'A abertura automática não aconteceu. Toque abaixo para tentar com sua confirmação.';
        }
      } else if (ios) {
        estado.textContent = 'No iPhone, use o menu do aplicativo para abrir esta página no navegador. Depois, toque em “Continuar para o site”.';
        ajuda.textContent = 'O iPhone não oferece a esta página um comando para solicitar o navegador padrão. O botão abre o site; ele pode continuar dentro do aplicativo.';
      } else {
        estado.textContent = 'Esta página testa a abertura no navegador pelo celular. No computador, continue para acessar o site.';
      }

      document.getElementById('copiar').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(destino);
          estado.textContent = 'Link copiado. Cole na barra de endereço do seu navegador.';
        } catch {
          const campo = document.getElementById('endereco');
          campo.focus();
          campo.select();
          estado.textContent = 'Selecione e copie o endereço acima para abrir no seu navegador.';
        }
      });
    })();
  </script>
</body>
</html>
